# ByteTrack tuned for small, fast-moving drones
# (defaults: ultralytics/cfg/trackers/bytetrack.yaml)
tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.05   # default 0.1
new_track_thresh: 0.30   # default 0.25
track_buffer: 60         # default 30
match_thresh: 0.8
fuse_score: True
